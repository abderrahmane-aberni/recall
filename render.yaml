services:
  - type: web
    name: recall-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      # Pin the build image's Python version. Render's default has moved to
      # 3.14, which doesn't yet have prebuilt wheels for pydantic-core==2.27.2
      # (pulled in by pydantic==2.10.4) - pip falls back to compiling it from
      # source via Rust/maturin, which fails in Render's build sandbox because
      # its cargo cache directory is read-only. 3.11 has wheels for every
      # pinned dependency here and matches what was tested locally.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      # Render's free tier has 512MB RAM - sentence-transformers + torch (the
      # "local" embedding backend) doesn't fit. Production runs on Gemini's
      # embedding API instead; "local" stays the default for local dev, where
      # RAM isn't a constraint and avoiding API calls while iterating is nice.
      - key: EMBEDDING_BACKEND
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: CHUNK_SIZE_CHARS
        value: "1200"
      - key: CHUNK_OVERLAP_CHARS
        value: "200"
      - key: RETRIEVAL_TOP_K
        value: "5"
      # Matches the Streamlit upload widget's own displayed limit ("Limit
      # 200MB per file") so the two don't silently disagree - a file the
      # widget accepts no longer gets rejected by the backend after upload.
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: RATE_LIMIT_PER_IP_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_GLOBAL_PER_DAY
        value: "200"
  - type: web
    name: recall-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    # Build context must be the frontend/ directory itself, not the repo root -
    # the Dockerfile's COPY commands use bare filenames (COPY streamlit_app.py .)
    # which only resolve inside frontend/. (A repo-root context was copy-pasted
    # from a different project's setup and never actually matched this
    # Dockerfile - first deploy failed with "streamlit_app.py: not found".)
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        sync: false
